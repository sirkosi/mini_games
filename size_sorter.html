---
layout: default
---
<style>
  html, body {
    position: static !important;
    overflow: auto !important;
  }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
  }

  .icon-btn {
    background: rgba(255,255,255,0.55);
    border: none;
    border-radius: 50%;
    width: 52px;
    height: 52px;
    font-size: 1.6rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    text-decoration: none;
    transition: background 0.15s;
  }
  .icon-btn:active { background: rgba(255,255,255,0.85); }

  .game-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 16px 30px;
    gap: 28px;
  }

  .instruction {
    font-size: 1.4rem;
    font-weight: 700;
    color: #1565c0;
    text-align: center;
  }

  .pool {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 24px;
    min-height: 110px;
    background: rgba(255,255,255,0.45);
    border-radius: 24px;
    padding: 16px 24px;
    width: 100%;
    max-width: 480px;
    box-sizing: border-box;
  }

  .elephant {
    cursor: grab;
    touch-action: none;
    line-height: 1;
    display: block;
    transition: opacity 0.2s;
  }
  .elephant:active { cursor: grabbing; }

  .target-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: flex-end;
  }

  .slot-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .slot-label {
    font-size: 0.95rem;
    font-weight: 700;
    color: #455a64;
  }

  .slot {
    width: 90px;
    height: 90px;
    border: 3px dashed #90caf9;
    border-radius: 18px;
    background: rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, border-color 0.2s;
  }

  .slot.over {
    background: rgba(144,202,249,0.45);
    border-color: #1e88e5;
  }

  .slot.correct-slot { background: #c8e6c9; border-color: #66bb6a; }
  .slot.wrong-slot   { background: #ffcdd2; border-color: #ef9a9a; }

  .feedback {
    font-size: 2.2rem;
    text-align: center;
    min-height: 56px;
    font-weight: 700;
    color: #1565c0;
  }

  .next-btn {
    background: #1e88e5;
    color: white;
    border: none;
    border-radius: 50px;
    padding: 14px 36px;
    font-size: 1.3rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(30,136,229,0.4);
    touch-action: manipulation;
    display: none;
  }

  @media (min-width: 600px) {
    .slot { width: 110px; height: 110px; }
    .instruction { font-size: 1.7rem; }
  }
</style>

<div class="topbar">
  <a href="/mini_games/" class="icon-btn" title="Zurück">🏠</a>
  <button class="icon-btn" onclick="spreche()" title="Vorlesen">🔊</button>
</div>

<div class="game-area">
  <div class="instruction">Ordne die Tiere: vom Kleinsten zum Größten! ➡️</div>

  <div class="pool" id="pool"></div>

  <div class="target-row">
    <div class="slot-wrap">
      <div class="slot-label">1️⃣ Klein</div>
      <div class="slot" id="slot0" data-index="0"></div>
    </div>
    <div class="slot-wrap">
      <div class="slot-label">2️⃣ Mittel</div>
      <div class="slot" id="slot1" data-index="1"></div>
    </div>
    <div class="slot-wrap">
      <div class="slot-label">3️⃣ Groß</div>
      <div class="slot" id="slot2" data-index="2"></div>
    </div>
  </div>

  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="nextBtn" onclick="neueRunde()">Weiter ▶</button>
</div>

<script>
  // Sizes from small to large (correct order = index 0,1,2)
  const SIZES = [
    { label: 'klein',  fs: '2.8rem',  sizeIndex: 0 },
    { label: 'mittel', fs: '4.8rem',  sizeIndex: 1 },
    { label: 'groß',   fs: '7rem',    sizeIndex: 2 },
  ];

  let clone = null;
  let dragging = null;
  let originParent = null;
  let originNext = null;

  const spreche = (text) => {
    window.speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(text || 'Sortiere die Tiere vom Kleinsten zum Größten!');
    msg.lang = 'de-DE';
    msg.rate = 0.85;
    window.speechSynthesis.speak(msg);
  };

  const alleSlotsBelegt = () =>
    [0,1,2].every(i => document.getElementById('slot' + i).querySelector('.elephant'));

  const pruefeReihenfolge = () => {
    let korrekt = true;
    for (let i = 0; i < 3; i++) {
      const slot = document.getElementById('slot' + i);
      const el = slot.querySelector('.elephant');
      if (!el || parseInt(el.dataset.sizeIndex) !== i) {
        korrekt = false;
        slot.classList.add('wrong-slot');
        slot.classList.remove('correct-slot');
      } else {
        slot.classList.add('correct-slot');
        slot.classList.remove('wrong-slot');
      }
    }
    if (korrekt) {
      document.getElementById('feedback').textContent = '⭐ Richtig! Super gemacht! ⭐';
      spreche('Richtig! Du hast die Tiere perfekt sortiert! Super gemacht!');
      document.getElementById('nextBtn').style.display = 'inline-block';
    } else {
      document.getElementById('feedback').textContent = '❌ Nicht ganz – versuch es nochmal!';
      setTimeout(() => spreche('Nicht ganz richtig. Versuch es nochmal!'), 100);
      // Reset wrong slots after a moment
      setTimeout(() => {
        for (let i = 0; i < 3; i++) {
          const slot = document.getElementById('slot' + i);
          slot.classList.remove('wrong-slot', 'correct-slot');
          const el = slot.querySelector('.elephant');
          if (el) {
            document.getElementById('pool').appendChild(el);
          }
        }
        document.getElementById('feedback').textContent = '';
      }, 1400);
    }
  };

  const startDrag = (el, e) => {
    if (e.button !== undefined && e.button !== 0) return;
    dragging = el;
    originParent = el.parentElement;
    originNext = el.nextSibling;

    clone = el.cloneNode(true);
    clone.style.position = 'fixed';
    clone.style.pointerEvents = 'none';
    clone.style.zIndex = '999';
    clone.style.opacity = '0.85';
    clone.style.transform = 'scale(1.1)';
    clone.style.transition = 'none';
    positionClone(e);
    document.body.appendChild(clone);
    el.style.opacity = '0.25';

    el.setPointerCapture(e.pointerId);
  };

  const positionClone = (e) => {
    if (!clone) return;
    const w = parseFloat(clone.style.fontSize || '4rem') * 16;
    const h = w;
    clone.style.left = (e.clientX - 30) + 'px';
    clone.style.top  = (e.clientY - 30) + 'px';
  };

  const endDrag = (e) => {
    if (!clone || !dragging) return;
    document.body.removeChild(clone);
    clone = null;
    dragging.style.opacity = '1';

    // Find target slot
    const elemBelow = document.elementFromPoint(e.clientX, e.clientY);
    const targetSlot = elemBelow?.closest('.slot');

    if (targetSlot && !targetSlot.querySelector('.elephant')) {
      targetSlot.appendChild(dragging);
    } else {
      // Return to origin
      if (originNext) {
        originParent.insertBefore(dragging, originNext);
      } else {
        originParent.appendChild(dragging);
      }
    }
    dragging = null;

    if (alleSlotsBelegt()) {
      setTimeout(pruefeReihenfolge, 150);
    }
  };

  const attachDrag = (el) => {
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      startDrag(el, e);
    });
    el.addEventListener('pointermove', (e) => {
      e.preventDefault();
      positionClone(e);
    });
    el.addEventListener('pointerup', (e) => {
      e.preventDefault();
      endDrag(e);
    });
    el.addEventListener('pointercancel', (e) => {
      if (clone) { document.body.removeChild(clone); clone = null; }
      if (dragging) { dragging.style.opacity = '1'; dragging = null; }
    });
  };

  const neueRunde = () => {
    document.getElementById('feedback').textContent = '';
    document.getElementById('nextBtn').style.display = 'none';
    for (let i = 0; i < 3; i++) {
      const slot = document.getElementById('slot' + i);
      slot.innerHTML = '';
      slot.classList.remove('correct-slot', 'wrong-slot');
    }

    // Shuffle sizes
    const shuffled = [...SIZES].sort(() => Math.random() - 0.5);
    const pool = document.getElementById('pool');
    pool.innerHTML = '';
    shuffled.forEach(s => {
      const span = document.createElement('span');
      span.className = 'elephant';
      span.dataset.sizeIndex = s.sizeIndex;
      span.style.fontSize = s.fs;
      span.textContent = '🐘';
      pool.appendChild(span);
      attachDrag(span);
    });

    spreche();
  };

  neueRunde();
</script>
