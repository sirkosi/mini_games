---
layout: default
---
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #piano {
    display: flex;
    width: 100vw;
    height: 100vh;
    position: fixed;
    top: 0; left: 0;
  }

  .key {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 18px;
    cursor: pointer;
    touch-action: none;
    transition: filter 0.08s ease;
    position: relative;
    box-sizing: border-box;
    border-right: 2px solid rgba(255,255,255,0.25);
  }

  .key:last-child { border-right: none; }

  .key.pressed { filter: brightness(1.35) saturate(1.2); }

  .key-note {
    font-size: clamp(0.9rem, 3vw, 1.5rem);
    font-weight: 900;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    letter-spacing: 1px;
  }

  .key-emoji {
    font-size: clamp(1.2rem, 4vw, 2.2rem);
    margin-bottom: 4px;
    line-height: 1;
  }

  /* Ripple effect */
  .ripple {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    animation: ripple-anim 0.45s ease-out forwards;
    pointer-events: none;
  }

  @keyframes ripple-anim {
    to { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
  }

  /* Back button overlay */
  .back-btn {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 100;
    background: rgba(0,0,0,0.3);
    border: none;
    border-radius: 50%;
    width: 52px;
    height: 52px;
    font-size: 1.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: background 0.15s;
    touch-action: manipulation;
  }
  .back-btn:active { background: rgba(0,0,0,0.5); }

  .audio-btn {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 100;
    background: rgba(0,0,0,0.3);
    border: none;
    border-radius: 50%;
    width: 52px;
    height: 52px;
    font-size: 1.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    touch-action: manipulation;
  }
  .audio-btn:active { background: rgba(0,0,0,0.5); }
</style>

<a href="/mini_games/" class="back-btn" title="Zurück">🏠</a>
<button class="audio-btn" onclick="spreche()" title="Vorlesen">🔊</button>

<div id="piano"></div>

<script>
const TASTEN = [
  { note: 'C',  freq: 261.63, color: '#F44336', emoji: '🔴' },
  { note: 'D',  freq: 293.66, color: '#FF9800', emoji: '🟠' },
  { note: 'E',  freq: 329.63, color: '#FFEB3B', emoji: '🟡' },
  { note: 'F',  freq: 349.23, color: '#4CAF50', emoji: '🟢' },
  { note: 'G',  freq: 392.00, color: '#03A9F4', emoji: '🔵' },
  { note: 'A',  freq: 440.00, color: '#3F51B5', emoji: '🟣' },
  { note: 'H',  freq: 493.88, color: '#9C27B0', emoji: '💜' },
  { note: 'C²', freq: 523.25, color: '#E91E63', emoji: '🩷' },
];

let audioCtx = null;
const aktiveOszillatoren = new Map();

const getAudioCtx = () => {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
};

const spieleNote = (freq, keyEl) => {
  const ctx = getAudioCtx();
  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.4, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + 1.2);
  aktiveOszillatoren.set(keyEl, { osc, gain });
};

const stoppeNote = (keyEl) => {
  const entry = aktiveOszillatoren.get(keyEl);
  if (entry) {
    try {
      const ctx = getAudioCtx();
      entry.gain.gain.cancelScheduledValues(ctx.currentTime);
      entry.gain.gain.setValueAtTime(entry.gain.gain.value, ctx.currentTime);
      entry.gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      entry.osc.stop(ctx.currentTime + 0.2);
    } catch(e) {}
    aktiveOszillatoren.delete(keyEl);
  }
};

const addRipple = (keyEl) => {
  const r = document.createElement('div');
  r.className = 'ripple';
  keyEl.appendChild(r);
  r.addEventListener('animationend', () => r.remove());
};

const spreche = (text) => {
  window.speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(text || 'Spiel ein Lied auf deinem bunten Klavier!');
  msg.lang = 'de-DE';
  msg.rate = 0.85;
  window.speechSynthesis.speak(msg);
};

// Multi-touch tracking: pointerId → key element
const pointerMap = new Map();

// Build piano
const piano = document.getElementById('piano');
TASTEN.forEach((t) => {
  const key = document.createElement('div');
  key.className = 'key';
  key.style.background = t.color;
  key.dataset.freq = t.freq;
  key.innerHTML = `<span class="key-emoji">${t.emoji}</span><span class="key-note">${t.note}</span>`;

  key.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    key.setPointerCapture(e.pointerId);
    if (pointerMap.has(e.pointerId)) return;
    pointerMap.set(e.pointerId, key);
    key.classList.add('pressed');
    spieleNote(t.freq, key);
    addRipple(key);
  });

  key.addEventListener('pointerup', (e) => {
    e.preventDefault();
    pointerMap.delete(e.pointerId);
    key.classList.remove('pressed');
  });

  key.addEventListener('pointercancel', (e) => {
    pointerMap.delete(e.pointerId);
    key.classList.remove('pressed');
  });

  // Handle pointer moving to a different key while dragging
  key.addEventListener('pointermove', (e) => {
    e.preventDefault();
    // Check if pointer has moved off this key
    const rect = key.getBoundingClientRect();
    const inside = e.clientX >= rect.left && e.clientX <= rect.right &&
                   e.clientY >= rect.top  && e.clientY <= rect.bottom;
    if (!inside && pointerMap.get(e.pointerId) === key) {
      key.classList.remove('pressed');
      pointerMap.delete(e.pointerId);
      // Find the key under the pointer
      const els = document.elementsFromPoint(e.clientX, e.clientY);
      const newKey = els.find(el => el.classList.contains('key'));
      if (newKey && !pointerMap.has(e.pointerId)) {
        pointerMap.set(e.pointerId, newKey);
        newKey.classList.add('pressed');
        spieleNote(parseFloat(newKey.dataset.freq), newKey);
        addRipple(newKey);
      }
    }
  });

  piano.appendChild(key);
});

// Speak instructions after a short delay
window.addEventListener('load', () => {
  setTimeout(spreche, 800);
});
</script>
